# SonarCloud Automatic Analysis settings (Automatic Analysis reads this file; a CI-driven scan
# ignores it and reads sonar-project.properties instead).
#
# Test files are excluded from copy-paste detection. A table of test cases is repetitive by
# design, and the detector normalizes string literals, so a table of [title, input, expected]
# rows reads to it as one block duplicated row after row. Counting that against the 3%
# duplication-on-new-code gate fails pull requests over test data, not over duplicated logic.
# The globs are the repository's test-file locations: packages/*/test/** and scripts/*.test.mjs.
#
# If the project moves to a CI-driven scan, carry this line into sonar-project.properties and
# delete this file, or the exclusion silently stops applying.
sonar.cpd.exclusions=packages/*/test/**,scripts/*.test.mjs
