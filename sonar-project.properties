# SonarCloud CI-based analysis. Automatic Analysis (no properties file, no workflow step) cannot
# import a coverage report, which is why the quality gate's coverage condition read 0% on every
# pull request before this file existed. This file plus the scan step in
# .github/workflows/code-quality.yml replace it; Automatic Analysis must be turned OFF for the
# project in SonarCloud's own settings, or the two analyses conflict (repository/organization
# admin action, not something this file or the workflow can do).
sonar.organization=navecss
sonar.projectKey=navecss_navecss
sonar.sourceEncoding=UTF-8

# Every package plus the repo-root scripts/ directory. Test files live alongside their subject
# under the same roots (packages/*/test/**, scripts/*.test.mjs), so sonar.test.inclusions
# reclassifies them rather than pointing sonar.tests at a second, disjoint set of directories.
sonar.sources=packages,scripts
sonar.test.inclusions=packages/*/test/**,scripts/*.test.mjs

# Test files are excluded from copy-paste detection: a table of test cases is repetitive by
# design, and counting it against the duplication-on-new-code gate fails pull requests over test
# data rather than over duplicated logic. Same globs as sonar.test.inclusions above.
sonar.cpd.exclusions=packages/*/test/**,scripts/*.test.mjs

# dist/ and coverage/ are build output, never analyzed as source; fixtures/ under any test/
# directory are test data (some hand-written, some generated by a pre-test script, e.g. core's
# test/browser/fixtures/), not code to measure. Declaration files are NOT excluded: every one
# outside dist/ and fixtures/ is hand-written (stylelint-config's published index.d.ts among them).
sonar.exclusions=**/dist/**,**/coverage/**,**/fixtures/**

# @navecss/base-ui, @navecss/core, @navecss/eslint-plugin, @navecss/stylelint-config and
# @navecss/tokens produce a coverage report. The rest were checked, not assumed:
#   - @navecss/bridge is CSS-only: its src/ has no JS/TS for v8 to instrument, so a coverage
#     block would report on nothing.
#   - @navecss/cli has JS source (src/index.ts) and a vitest coverage block was tried, but its
#     one test (no-inlined-dependency.test.ts) reads the built dist/*.js as text rather than
#     importing src/index.ts, so v8 never instruments it either — the resulting lcov.info was
#     measured empty (0 bytes), a silent zero of exactly the kind this issue exists to fix, so
#     the coverage block was removed again rather than shipped.
#   - scripts/ runs under node:test, not vitest, with no coverage reporter wired at all.
# All three read 0%/no-coverage-computed after this lands, and that is a stated decision, not a
# silent gap. Wiring any of them in is separate work (a real test that imports @navecss/cli's
# source, a node:test --experimental-test-coverage lcov reporter for scripts/, or a real
# coverage question for bridge's CSS).
#
# @navecss/eslint-plugin is measured, but only through the tests that import its src/ directly,
# which is most of them. Three suites also exercise compiled output (bulk-suppressions spawns the
# ESLint CLI against dist/index.js, package-shape installs the packed tarball into a scratch
# consumer, zero-runtime-and-source-only compiles a scratch copy outside the repository and
# imports that), and no-inlined-dependency reads dist/*.js as text. None of that reaches src/:
# coverage counts only what the test process itself loads from inside the package, so a spawned
# process and a copy outside the repository report nothing. A source line reached ONLY through
# one of those compiled paths reads uncovered.
#
# Vitest's v8 provider writes each lcov SF: (source file) line relative to the PACKAGE's own root
# (e.g. "src/atoms.ts" in @navecss/core's coverage/lcov.info). SonarCloud's analyzer resolves such a
# path against the report file's own directory first (SonarJS 13.0 and later), so it would resolve
# unaided; analyzers before 13.0 matched it by suffix across every package and took the first hit.
# scripts/prefix-lcov-source-paths.mjs rewrites every SF: line to be repo-root-relative (e.g.
# "packages/core/src/atoms.ts") so resolution does not depend on the analyzer version, and fails the
# job when a report listed below is missing, which Sonar itself logs only at INFO. It reads its
# package list from this property, so this line is the one list of measured packages. Verify a
# known-covered file (e.g. packages/tokens/src/theming/core-contract.ts) shows non-zero coverage in
# the Sonar UI after the first real run: a green quality gate does not confirm this.
sonar.javascript.lcov.reportPaths=packages/base-ui/coverage/lcov.info,packages/core/coverage/lcov.info,packages/eslint-plugin/coverage/lcov.info,packages/stylelint-config/coverage/lcov.info,packages/tokens/coverage/lcov.info
