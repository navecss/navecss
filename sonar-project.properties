# SonarCloud CI-based analysis. Automatic Analysis (no properties file, no workflow step) cannot
# import a coverage report, which is why the quality gate's coverage condition read 0% on every
# pull request before this file existed. This file plus the scan step in
# .github/workflows/code-quality.yml replace it; Automatic Analysis must be turned OFF for the
# project in SonarCloud's own settings, or the two analyses conflict (repository/organization
# admin action, not something this file or the workflow can do).
sonar.organization=navecss
sonar.projectKey=navecss_navecss
sonar.sourceEncoding=UTF-8

# Every package plus the repo-root scripts/ directory. Test files live alongside their subject
# under the same roots (packages/*/test/**, scripts/*.test.mjs), so sonar.test.inclusions
# reclassifies them rather than pointing sonar.tests at a second, disjoint set of directories.
sonar.sources=packages,scripts
sonar.test.inclusions=packages/*/test/**,scripts/*.test.mjs

# dist/ and coverage/ are build output, never analyzed as source; .d.ts/.d.mts are generated type
# declarations; fixtures/ under any test/ directory are test data (some hand-written, some
# generated by a pre-test script, e.g. core's test/browser/fixtures/), not code to measure.
sonar.exclusions=**/dist/**,**/coverage/**,**/*.d.ts,**/*.d.mts,**/fixtures/**

# Only @navecss/core and @navecss/tokens produce a coverage report today. Each of the other two
# packages was checked, not assumed:
#   - @navecss/bridge is CSS-only: its src/ has no JS/TS for v8 to instrument, so a coverage
#     block would report on nothing.
#   - @navecss/cli has JS source (src/index.ts) and a vitest coverage block was tried, but its
#     one test (no-inlined-dependency.test.ts) reads the built dist/*.js as text rather than
#     importing src/index.ts, so v8 never instruments it either — the resulting lcov.info was
#     measured empty (0 bytes), a silent zero of exactly the kind this issue exists to fix, so
#     the coverage block was removed again rather than shipped.
#   - scripts/ runs under node:test, not vitest, with no coverage reporter wired at all.
# All three read 0%/no-coverage-computed after this lands, and that is a stated decision, not a
# silent gap. Wiring any of them in is separate work (a real test that imports @navecss/cli's
# source, a node:test --experimental-test-coverage lcov reporter for scripts/, or a real
# coverage question for bridge's CSS).
#
# The lcov SF: (source file) line vitest's v8 provider writes is relative to the PACKAGE's own
# root (e.g. "src/atoms.ts" inside @navecss/core's own coverage/lcov.info), not to this file's
# sonar.sources root. Sonar resolves SF: against sonar.sources, so an unprefixed path from one
# package can silently collide with a same-named path in another and misattribute coverage under
# a scan that still reports green. scripts/prefix-lcov-source-paths.mjs rewrites every SF: line
# to be repo-root-relative (e.g. "packages/core/src/atoms.ts") before this scan runs; verify a
# known-covered file (e.g. packages/tokens/src/theming/core-contract.ts) actually shows non-zero
# coverage in the Sonar UI after the first real run — a green quality gate does not confirm this.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/tokens/coverage/lcov.info
