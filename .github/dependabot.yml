version: 2
updates:
  # npm/pnpm workspace: pnpm-workspace.yaml roots every package under packages/*, so the single
  # root directory entry covers the whole monorepo (dependabot resolves the workspace itself).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # commitlint.config.js's scope-enum allows `deps` but not the `deps-dev` Dependabot writes
    # for development-dependency updates by default (`include: scope` would produce that split
    # itself, so this deliberately sets prefix-development to the SAME literal prefix as prefix
    # instead of using include: scope). Without this, a dev-dependency bump carries a subject
    # the local commit-msg hook would reject; the PR-title check would flag it, but that check
    # is not required and never sees the commits a rebase merge lands.
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    groups:
      # tokens/core ride the Changesets `fixed` group; keep their
      # own devDependency bumps from opening a flood of one-line PRs.
      dev-dependencies:
        dependency-type: 'development'
        # @base-ui/react is base-ui's peer as well as its dev dependency, and base-ui's tests pin
        # Base UI's surface (the export map, the generated wrappers, the parts' ARIA semantics)
        # to the version it builds against. A Base UI minor is therefore an upgrade of base-ui,
        # not a routine bump: it gets its own pull request rather than holding the group back.
        #
        # mdn-data is core's dev dependency only, but its css/properties.json is the seed of the
        # property table core generates and ships in dist/ (scripts/generate-property-table.ts),
        # so a new mdn-data changes which properties @nave knows. That is a change to core that
        # needs the table regenerated and a changeset, so it too gets its own pull request.
        exclude-patterns:
          - '@base-ui/react'
          - 'mdn-data'
    ignore:
      # TypeScript 7 breaks the build today: typescript-eslint 8.70 throws "does not support
      # TS 7.0" at plugin load (so nothing can be linted), and tsup's bundled rollup-plugin-dts
      # crashes producing declaration files for core and cli. Revisit once typescript-eslint
      # ships TS 7 support and rollup-plugin-dts no longer crashes under it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-plugin-unicorn 75's recommended preset adds 49 new lint failures across the
      # monorepo (mostly prefer-ternary, plus prefer-combined-guards, a rule that didn't exist
      # in 73). Revisit once someone is willing to make the readability case for adopting them.
      - dependency-name: 'eslint-plugin-unicorn'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows only. The composite actions under .github/actions/ pin
    # actions of their own (setup's jdx/mise-action, which every code-quality job runs), and
    # Dependabot reads them only when their directories are listed.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
