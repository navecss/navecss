name: code-quality

# Every step of the local `pnpm run ci:check` gate (scripts/run-ci-check.mjs), each as its own
# job, so a red run names the check that failed without anyone reading a log. No check runs
# twice:
#
# - `build` hands its output to every job that reads `dist/` as an artifact: `dist/` itself plus
#   turbo's cache, so a job's turbo task finds `build` already done instead of running it again.
# - `test` runs the suites once, with coverage, and the `sonar` job scans the pinned leg's
#   reports rather than running the suites a second time to produce its own.
# - `build` and `test` each have a second leg on Node 22.18, the package.json "engines" floor.
#   That is the one deliberate repeat: the same check on a different Node, to prove the floor
#   the packages claim.
#
# scripts/check-ci-jobs-match-ci-check.mjs fails if a ci:check step is run by no job or by more
# than one, or if a job runs a step twice. Every job installs its toolchain through
# .github/actions/setup.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: pinned
            label: node from mise.toml
            node-version: ''
          - leg: floor
            label: node 22.18, the engines floor
            node-version: '22.18.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: pnpm run build

      - name: Hand the build output to the jobs that read it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-${{ matrix.leg }}
          path: |
            packages/*/dist
            .turbo/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  typecheck:
    name: typecheck
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-pinned

      - name: Typecheck
        run: pnpm run typecheck

  lint:
    name: lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-pinned

      - name: Lint
        run: pnpm run lint

  test:
    name: test (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: pinned
            label: node from mise.toml
            node-version: ''
          - leg: floor
            label: node 22.18, the engines floor
            node-version: '22.18.0'
    steps:
      # `packages/stylelint-config/test/values.test.ts` pins a fixture against a commit and is
      # skipped without history, so this job fetches all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-${{ matrix.leg }}

      # Both legs measure coverage, as every test run does. Turning it off on the floor leg would
      # take an argument, and turbo hashes arguments into every task, build included, so that leg
      # would rebuild instead of using the build output it was given.
      - name: Run the suites
        run: pnpm run test

      # The floor leg proves the suites pass on Node 22.18; the pinned leg's reports are scanned.
      - name: Hand the coverage reports to the sonar job
        if: matrix.leg == 'pinned'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  test-browser:
    name: test:browser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-pinned

      - name: Cache Playwright's browser engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright's browser engine
        run: pnpm --filter @navecss/core exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm run test:browser

  check-pack:
    name: check:pack
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-pinned

      - name: Validate the packed packages (publint, attw)
        run: pnpm run check:pack

  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Dead code, unused exports and dependencies
        run: pnpm run knip

  deps-lint:
    name: deps:lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Consistent dependency versions (syncpack)
        run: pnpm run deps:lint

  deps-dedupe-check:
    name: deps:dedupe-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: No duplicate resolution the lockfile could collapse
        run: pnpm run deps:dedupe-check

  scripts-test:
    name: scripts:test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-pinned

      - name: The repository gates' own tests
        run: pnpm run scripts:test

  scripts-check:
    name: scripts:check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup

      - name: Take the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-pinned

      - name: The repository gates
        run: pnpm run scripts:check

  sonar:
    name: sonar
    needs: test
    runs-on: ubuntu-latest
    env:
      # A step's `if:` cannot reference the `secrets` context directly (GitHub Actions rejects
      # it as an invalid expression context there), so the truthiness check that guards the
      # SonarCloud scan step below has to be done here, once, as a job-level env var it CAN read.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Sonar's own recommendation: a shallow clone degrades its blame-based reporting
          # (new-code detection, issue authorship), so this job's checkout takes the full history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The reports were uploaded from packages/*/coverage/lcov.info, and an artifact keeps paths
      # relative to the files' common directory, packages/, so that is where they go back.
      - name: Take the coverage reports from the test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: packages

      - name: 'Rewrite coverage lcov SF: paths to be repo-root-relative'
        run: node scripts/prefix-lcov-source-paths.mjs

      # Two independent reasons this can be skipped, either of which must skip the step rather
      # than fail the job if this ran unconditionally: (1) a pull request from a fork does not
      # receive repository secrets on a public repo, so SONAR_TOKEN would be empty; (2) before the
      # SONAR_TOKEN repository secret exists at all (an admin step, tracked separately from this
      # change), every run on every PR would otherwise fail here. Once the secret exists, this
      # step runs and a real scan failure fails the job, as intended.
      - name: SonarCloud scan
        if: |
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
