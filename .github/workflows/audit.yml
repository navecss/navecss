name: audit

# Weekly dependency audit, ported from PocketAces' scheduled `bun audit`, same shape: `pnpm
# audit` on a schedule rather than blocking every PR. `workflow_dispatch` lets it be run on
# demand too.
#
# Scoped to production dependencies (`--prod`), the only dependencies a published tarball
# installs. Development dependencies are kept current by the weekly Dependabot updates configured
# in `.github/dependabot.yml`.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise-pinned toolchain (node + pnpm)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.8.3

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high
