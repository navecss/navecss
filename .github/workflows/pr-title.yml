name: pr-title

# Semantic PR-title check, ported from PocketAces. Keeps the Changesets history honest:
# Changesets' own changelog generation and squash-merge summaries lean on a conventional
# subject line, the same convention commitlint already enforces on every commit
# (commitlint.config.js).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
